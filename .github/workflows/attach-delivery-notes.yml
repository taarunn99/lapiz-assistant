name: Attach delivery notes

# Three ways this runs:
#   1. The Delivery Notes app: someone taps "Attach to invoices". The app sends the scan's download
#      link here (repository_dispatch, event dn-scan). Runs live immediately.
#   2. Every day at 08:10 Dubai: the ONE daily email (to Suman, CC Tarun and Adil): every scan since the
#      previous email, pages that still need a person, invoices delivered short (reminded every 2 days),
#      invoices with no note for 2+ days. App runs attach silently; nothing else sends mail or Cliq.
#   3. Run workflow button, for a manual dry or live run.
#
# Every page is verified against the invoice (customer, date, every item by SKU and name, TRN)
# before it is attached. Anything that does not agree is held for a person.

on:
  repository_dispatch:
    types: [dn-scan]
  schedule:
    - cron: "10 4 * * *"      # 08:10 Dubai: the one daily email
  workflow_dispatch:
    inputs:
      mode:
        description: "dry (report only) or live (attach to invoices)"
        required: true
        default: dry
        type: choice
        options: [dry, live]
      file:
        description: "Optional: one file name inside dn-inbox (blank = every PDF in dn-inbox)"
        required: false
        default: ""

concurrency:
  group: attach-delivery-notes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils
          pip install requests pypdf pillow pillow-heif
      - name: Fetch the scan sent by the app
        if: github.event_name == 'repository_dispatch'
        env:
          FILE_URL: ${{ github.event.client_payload.url }}
          FILE_NAME: ${{ github.event.client_payload.filename }}
        run: |
          mkdir -p dn-inbox
          safe=$(printf '%s' "$FILE_NAME" | tr -c 'A-Za-z0-9._ -' '_')
          echo "downloading $safe"
          curl -sSfL "$FILE_URL" -o "dn-inbox/$safe"
          ls -la dn-inbox
      - name: Run
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID_DXB: ${{ secrets.ZOHO_ORG_ID_DXB }}
          DN_SEND_EMAIL: ${{ github.event_name == 'schedule' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DN_REPORT_TO: ${{ vars.DN_REPORT_TO || 'sumon.a@lapizblue.com' }}
          DN_SHORT_TO: ${{ vars.DN_SHORT_TO || 'sumon.a@lapizblue.com' }}
          REMIND_EVERY_DAYS: ${{ vars.REMIND_EVERY_DAYS || '2' }}
          DN_LEDGER: dn-ledger.json
          DN_REPORT_CC: ${{ vars.DN_REPORT_CC || 'tarun.s@lapizblue.com,adil@lapizblue.com' }}
          DN_REPORT_FROM: ${{ vars.DN_REPORT_FROM || 'Delivery Notes <delivery-notes@lapizblue.com>' }}
          OVERDUE_DAYS: ${{ vars.OVERDUE_DAYS || '2' }}
          OVERDUE_FROM: ${{ vars.OVERDUE_FROM || '2026-10-22' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
          ONLY_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.file || '' }}
          SCAN_URL: ${{ github.event.client_payload.url || '' }}
          SCAN_BY: ${{ github.event.client_payload.uploaded_by || '' }}
          INBOX: dn-inbox
          OUT: out
          OCR_WORKERS: "4"
        run: python scripts/attach_delivery_notes.py 2>&1 | tee out_log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-notes-out
          path: |
            out/report.md
            out/report.csv
            out/missing.csv
            out/overdue.csv
            out/split
            out/unmatched
            out/needs-check
            out_log.txt
          retention-days: 90
      - name: Move processed scans to dn-done (live only)
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'live')
        run: |
          mkdir -p "dn-done/$(date -u +%Y-%m)"
          python3 - <<'EOF'
          import json, os, shutil, datetime
          done = f"dn-done/{datetime.datetime.utcnow().strftime('%Y-%m')}"
          # scans sent by the app already live in the app's file store (their link is in the report),
          # so they are deleted here instead of being kept in git
          from_app = "${{ github.event_name }}" == "repository_dispatch"
          if from_app:
              # whatever happened to the run (done, failed, cancelled), the downloaded scan never goes into git
              for f in os.listdir("dn-inbox"):
                  if f != "README.md":
                      os.remove(os.path.join("dn-inbox", f))
          elif os.path.exists("out/processed.json"):
              for p in json.load(open("out/processed.json")):
                  if os.path.exists(p):
                      shutil.move(p, os.path.join(done, os.path.basename(p)))
          if os.path.exists("out/report.md"):
              shutil.copy("out/report.md", os.path.join(done, "report-" + datetime.datetime.utcnow().strftime('%Y-%m-%d-%H%M') + ".md"))
          EOF
          git config user.name "dn-attach-bot"
          git config user.email "dn-attach-bot@users.noreply.github.com"
          git add dn-inbox dn-done dn-ledger.json || true
          if git diff --cached --quiet; then echo "nothing to move"; exit 0; fi
          git commit -m "Delivery notes $(date -u '+%Y-%m-%d %H:%M')" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "push failed, report is in the run artifact"
