name: Audit delivery notes (backlog check)

# One-off, read-only check: which invoices have no delivery note attached, and which invoice lines are
# on none of the attached notes. Nothing is attached or changed in Zoho. The result (one Excel) is
# emailed to the address given and kept as the run artifact. Run it from the "Run workflow" button.

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "First invoice date to check (yyyy-mm-dd)"
        required: true
        default: "2026-10-01"
      date_to:
        description: "Last invoice date to check (yyyy-mm-dd, blank = today)"
        required: false
        default: ""
      email_to:
        description: "Send the Excel to (comma separated)"
        required: true
        default: "tarun.s@lapizblue.com"
      limit:
        description: "Test only: stop after this many invoices with files (0 = all)"
        required: false
        default: "0"
      simple:
        description: "deep = which invoices have NO delivery note, Dubai and Abu Dhabi, every attached file checked; simple = quick list by flag; full = items per note"
        required: true
        default: full
        type: choice
        options: [full, simple, deep]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils
          pip install requests pypdf pillow pillow-heif openpyxl
      - name: Run the audit
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID_DXB: ${{ secrets.ZOHO_ORG_ID_DXB }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DN_REPORT_FROM: ${{ vars.DN_REPORT_FROM || 'Delivery Notes <delivery-notes@lapizblue.com>' }}
          AUDIT_FROM: ${{ inputs.date_from }}
          AUDIT_TO: ${{ inputs.date_to }}
          AUDIT_TO_EMAIL: ${{ inputs.email_to }}
          AUDIT_LIMIT: ${{ inputs.limit }}
          AUDIT_SIMPLE: ${{ inputs.simple == 'simple' }}
          MODE: dry
          OUT: audit/engine-out
          OCR_WORKERS: "4"
          PACE_SECONDS: "0.7"
        run: |
          set -o pipefail
          if [ "${{ inputs.simple }}" = "deep" ]; then
            python scripts/audit_no_note.py 2>&1 | tee audit_log.txt
          else
            python scripts/audit_delivery_notes.py 2>&1 | tee audit_log.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-note-audit
          path: |
            audit/*.xlsx
            audit/*.csv
            audit_log.txt
          retention-days: 90
      - name: Keep the Excel in the repo (dn-audit folder)
        if: always()
        run: |
          set -e
          # Copy ONLY the audit files aside, move to the latest main, put them back, commit only dn-audit.
          # (The old step committed this run's whole stale checkout and rolled back the engine and the ledger.)
          stamp=$(date -u +%Y-%m-%d-%H%M)
          keep=$(mktemp -d)
          for f in audit/*.xlsx; do [ -f "$f" ] && cp "$f" "$keep/${stamp}-$(basename "$f")"; done
          cp audit_log.txt "$keep/${stamp}-log.txt" 2>/dev/null || true
          git config user.name "dn-attach-bot"
          git config user.email "dn-attach-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p dn-audit
            cp "$keep"/* dn-audit/ 2>/dev/null || { echo "nothing to save"; exit 0; }
            git add dn-audit
            git commit -q -m "Delivery note audit ${stamp}" || { echo "nothing to save"; exit 0; }
            if [ "$(git diff --name-only HEAD~1 HEAD | grep -v '^dn-audit/' | wc -l)" != "0" ]; then
              echo "refusing: commit touches files outside dn-audit"; exit 1
            fi
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
