name: Stock sync backfill

on:
  schedule:
    # every day at 13:00 Dubai (09:00 UTC): resumes the dry scan where it stopped,
    # capped at 4000 Zoho API calls so the rest of the company keeps its daily allowance
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry (plan only) or live (execute plan.json from the last dry run)"
        required: true
        default: dry
        type: choice
        options: [dry, live]
      so_numbers:
        description: "Optional: comma separated SO numbers to restrict to (testing)"
        required: false
        default: ""
      max_calls:
        description: "API call cap for this run"
        required: false
        default: "4000"

concurrency:
  group: stock-sync-backfill
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests openpyxl
      - name: Restore previous run output (resume dry, or plan for live)
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          mkdir -p out
          for id in $(gh run list --workflow stock-sync-backfill.yml --status completed --limit 15 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" -n backfill-out -D out 2>/dev/null; then echo "restored artifact from run $id"; break; fi
          done
          ls -la out || true
      - name: Run
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID_DXB: ${{ secrets.ZOHO_ORG_ID_DXB }}
          SO_NUMBERS: ${{ inputs.so_numbers || '' }}
          MAX_CALLS: ${{ inputs.max_calls || '4000' }}
        # a scheduled run has no inputs, so it is always a capped dry run
        run: python scripts/backfill_shipments.py ${{ inputs.mode || 'dry' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backfill-out, path: out, retention-days: 90 }
