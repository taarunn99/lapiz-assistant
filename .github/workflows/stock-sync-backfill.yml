name: Stock sync backfill

on:
  schedule:
    # every day at 13:10 Dubai (09:10 UTC, off the busy top of the hour): resumes the dry scan where it stopped.
    # Paced at 45 calls/min (org limit 100/min shared with Adil's 9:30 pull) and capped per run.
    - cron: "10 9 * * *"
    # LIVE history repair, 6 Oct 2026 (Tarun: Adil approved, API limits boosted until 11 Oct, run it fully).
    # Three live runs a day: 20:05, 02:05 and 08:05 Dubai. Each one resumes from done.json (it only touches sales
    # orders not done yet, re-checks each one right before acting), so when the history is finished these runs
    # find nothing to do and end in a minute. Remove these three lines once the backfill is complete.
    - cron: "5 16 * * *"
    - cron: "5 22 * * *"
    - cron: "5 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry (plan only) or live (execute plan.json from the last dry run)"
        required: true
        default: dry
        type: choice
        options: [dry, live]
      so_numbers:
        description: "Optional: comma separated SO numbers to restrict to (testing)"
        required: false
        default: ""
      live_scope:
        description: "Live only: type ALL to run the whole plan (night window 20:00 to 06:00 Dubai unless allow_daytime is 1). Leave empty when so_numbers is set."
        required: false
        default: ""
      allow_daytime:
        description: "Live ALL only: type 1 to allow a run outside the night window"
        required: false
        default: ""
      max_calls:
        description: "API call cap for this run"
        required: false
        default: "9000"

concurrency:
  group: stock-sync-backfill
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests openpyxl reportlab
      - name: Decide what this run does
        id: d
        run: |
          MODE="${{ inputs.mode }}"; SCOPE="${{ inputs.live_scope }}"; CALLS="${{ inputs.max_calls }}"; DAY="${{ inputs.allow_daytime }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "10 9 * * *" ]; then
              MODE=dry; SCOPE=""; CALLS=9000; DAY=""
            else
              # scheduled live run: whole plan, 14,500 calls at 45/min ends in about 5h20, inside the 345 minute job limit
              MODE=live; SCOPE=ALL; CALLS=14500; DAY=1
            fi
          fi
          echo "mode=${MODE:-dry}" >> "$GITHUB_OUTPUT"
          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"
          echo "calls=${CALLS:-9000}" >> "$GITHUB_OUTPUT"
          echo "day=${DAY}" >> "$GITHUB_OUTPUT"
          echo "this run: mode=${MODE:-dry} scope=${SCOPE} max_calls=${CALLS:-9000} allow_daytime=${DAY}"
      - name: Restore previous run output (resume dry, or plan for live)
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          mkdir -p out
          for id in $(gh run list --workflow stock-sync-backfill.yml --status completed --limit 15 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" -n backfill-out -D out 2>/dev/null; then echo "restored artifact from run $id"; break; fi
          done
          ls -la out || true
      - name: Run
        id: run
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID_DXB: ${{ secrets.ZOHO_ORG_ID_DXB }}
          SO_NUMBERS: ${{ inputs.so_numbers || '' }}
          LIVE_SCOPE: ${{ steps.d.outputs.scope }}
          ALLOW_DAYTIME: ${{ steps.d.outputs.day }}
          MAX_CALLS: ${{ steps.d.outputs.calls }}
          RATE_PER_MIN: "45"
        run: |
          set -o pipefail
          python scripts/backfill_shipments.py ${{ steps.d.outputs.mode }} 2>&1 | tee out/run_log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backfill-out, path: out, retention-days: 90 }
      - name: Daily progress report (PDF into reports/, counts only)
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_MODE: ${{ steps.d.outputs.mode }}
          MAX_CALLS: ${{ steps.d.outputs.calls }}
        run: |
          python scripts/daily_report.py || echo "report step had a problem, see above"
          git config user.name "stock-sync-bot"
          git config user.email "stock-sync-bot@users.noreply.github.com"
          git add reports || true
          if git diff --cached --quiet; then echo "no report changes"; exit 0; fi
          git commit -m "Daily progress report $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "push failed, report is still in the run artifact"
      - name: Email the report (skips until SMTP secrets exist)
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python scripts/send_report.py || echo "email step had a problem, see above"
